name: Suggest an improvement
description: Propose a feature or improve an existing workflow.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Tell us what would help you. This request is public."
  - type: dropdown
    id: page
    attributes:
      label: Studio page
      options:
        - "Vehicle Studio"
        - "Character Studio"
        - "Scene & Video Studio"
        - "Voice Studio"
        - "Logo & Brand Studio"
        - "CapCut Template Finder"
        - "Charity Rally Theme Planner"
        - "3D Print Studio"
        - "Workflow / ComfyUI Export"
        - "Projects & Prompt Lab"
        - "Whole site / unsure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "Explain the problem or task this would help with."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
